name: flutter_family_controls
description: iOS Screen Time plugin — FamilyControls authorization, FamilyActivityPicker app selection, and ManagedSettings shields to block selected apps.
version: 0.0.4
homepage: https://github.com/kyam28/flutter_family_controls
repository: https://github.com/kyam28/flutter_family_controls
issue_tracker: https://github.com/kyam28/flutter_family_controls/issues

environment:
  sdk: ^3.9.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: FlutterFamilyControlsPlugin
      android:
        package: com.kyam28.flutter_family_controls
        pluginClass: FlutterFamilyControlsPlugin
